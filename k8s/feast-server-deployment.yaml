apiVersion: apps/v1
kind: Deployment
metadata:
  name: feast-server
  labels:
    app: feast-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: feast-server
  template:
    metadata:
      labels:
        app: feast-server
    spec:
      serviceAccountName: batch-etl
      containers:
      - name: feast-server
        image: "${FEAST_STORE_IMAGE}"
        imagePullPolicy: IfNotPresent
        command: ["feast", "serve", "--host", "0.0.0.0", "--port", "6566"]
        env:
        - name: FEAST_REPO_PATH
          value: "/app/feast_store"
        ports:
        - name: http
          containerPort: 6566
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 15
          timeoutSeconds: 2
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: feast-server
  labels:
    app: feast-server
spec:
  type: ClusterIP
  selector:
    app: feast-server
  ports:
  - name: http
    port: 6566
    targetPort: http
