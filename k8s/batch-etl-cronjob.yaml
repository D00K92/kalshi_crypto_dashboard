apiVersion: v1
kind: ServiceAccount
metadata:
  name: batch-etl
  namespace: default
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch-etl
  namespace: default
  labels:
    app: batch-etl
spec:
  schedule: "15 * * * *"
  timeZone: "Etc/UTC"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: batch-etl
        spec:
          serviceAccountName: batch-etl
          restartPolicy: Never
          nodeSelector:
            cloud.google.com/gke-spot: "true"
          terminationGracePeriodSeconds: 15
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
          containers:
          - name: batch-etl
            image: "${BATCH_ETL_IMAGE}"
            command: ["python", "scripts/run_bigquery_hourly.py"]
            imagePullPolicy: IfNotPresent
            env:
            - name: GCS_BUCKET_NAME
              value: "${GCS_BUCKET_NAME}"
            - name: BATCH_ETL_OUTPUT_DATASET
              value: "processed/resampled_market_data"
            - name: BATCH_ETL_VENUES
              value: "binance,bitstamp,coinbase,crypto.com,gemini,kraken"
            - name: BATCH_ETL_FREQUENCIES
              value: "1s,5s,1m,5m,10m,30m,1h"
            - name: BATCH_ETL_BIGQUERY_TABLE
              value: "bars"
            - name: DASK_TEMPORARY_DIRECTORY
              value: "/tmp/dask"
            resources:
              requests:
                cpu: "1000m"
                memory: "2Gi"
                ephemeral-storage: "2Gi"
              limits:
                cpu: "4000m"
                memory: "8Gi"
                ephemeral-storage: "10Gi"
