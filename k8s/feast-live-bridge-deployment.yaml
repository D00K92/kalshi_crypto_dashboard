apiVersion: apps/v1
kind: Deployment
metadata:
  name: feast-live-bridge
  labels: {app: feast-live-bridge}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: feast-live-bridge}
  template:
    metadata:
      labels: {app: feast-live-bridge}
    spec:
      serviceAccountName: batch-etl
      containers:
      - name: feast-live-bridge
        image: "${FEAST_STORE_IMAGE}"
        imagePullPolicy: IfNotPresent
        # Execute as a module so the ``jobs`` package is importable from the
        # Feast repository working directory.
        command: ["python", "-m", "jobs.live_push"]
        env:
        - name: REDIS_URL
          value: "redis://${REDIS_HOST}:6379/0"
        - name: FEAST_REPO_PATH
          value: "/app/feast_store"
        - name: FEATURE_STREAM
          value: "stream:features:v2_10s"
        - name: FEATURE_VERSION
          value: "v2_10s"
        - name: FEAST_LIVE_GROUP
          value: "feast-live-features-v2-10s"
        - name: FEAST_PENDING_IDLE_MS
          value: "120000"
        resources:
          requests: {cpu: "50m", memory: "256Mi", ephemeral-storage: "100Mi"}
          limits: {cpu: "500m", memory: "1Gi", ephemeral-storage: "1Gi"}
