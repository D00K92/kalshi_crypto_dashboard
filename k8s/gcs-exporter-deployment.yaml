apiVersion: v1
kind: ServiceAccount
metadata:
  name: gcs-exporter
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcs-exporter
  labels:
    app: gcs-exporter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gcs-exporter
  template:
    metadata:
      labels:
        app: gcs-exporter
    spec:
      serviceAccountName: gcs-exporter
      terminationGracePeriodSeconds: 45
      containers:
      - name: gcs-exporter
        image: "${GCS_EXPORTER_IMAGE}"
        imagePullPolicy: IfNotPresent
        env:
        - name: REDIS_HOST
          value: "${REDIS_HOST}"
        - name: REDIS_PORT
          value: "${REDIS_PORT}"
        - name: GCS_BUCKET_NAME
          value: "${GCS_BUCKET_NAME}"
        - name: STREAM_NAME
          value: "stream:ticks"
        - name: CONSUMER_GROUP
          value: "gcs_archiver_group"
        - name: FLUSH_SIZE
          value: "10000"
        - name: FLUSH_INTERVAL_SEC
          value: "60"
        - name: RECLAIM_MIN_IDLE_MS
          value: "120000"
        - name: SHUTDOWN_GRACE_SECONDS
          value: "30"
        - name: HEALTH_PORT
          value: "8080"
        ports:
        - name: health
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /healthz
            port: health
          failureThreshold: 30
          periodSeconds: 2
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 15
          timeoutSeconds: 2
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
