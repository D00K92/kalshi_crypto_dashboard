apiVersion: batch/v1
kind: Job
metadata:
  name: feast-apply-${FEAST_APPLY_ID}
  labels:
    app: feast-apply
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: feast-apply
    spec:
      restartPolicy: Never
      serviceAccountName: batch-etl
      containers:
      - name: feast-apply
        image: "${FEAST_STORE_IMAGE}"
        command: ["feast", "apply"]
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
