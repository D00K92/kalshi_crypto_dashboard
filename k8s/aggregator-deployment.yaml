apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator
  labels:
    app: aggregator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aggregator
  template:
    metadata:
      labels:
        app: aggregator
    spec:
      containers:
      - name: aggregator
        image: "${AGGREGATOR_IMAGE}"
        imagePullPolicy: IfNotPresent
        env:
        - name: REDIS_HOST
          value: "${REDIS_HOST}"
        - name: REDIS_PORT
          value: "${REDIS_PORT}"
        - name: AGGREGATOR_OUTPUT_PREFIX
          value: "market"
        - name: BOOK_CONSUMER_GROUP
          value: "aggregator_books_v3"
        - name: TRADE_CONSUMER_GROUP
          value: "aggregator_trades_v3"
        - name: AGGREGATOR_GROUP_START_ID
          value: "$"
        - name: FEATURE_STREAM_MAXLEN
          value: "5000"
        - name: AGGREGATION_PRICE_TICK
          value: "0.01"
        - name: AGGREGATION_TAKER_FEES
          value: "binance=0,bitstamp=0,crypto.com=0,gemini=0,coinbase=0,kraken=0"
        - name: HEALTH_PORT
          value: "8080"
        ports:
        - name: health
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /healthz
            port: health
          failureThreshold: 30
          periodSeconds: 2
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 15
          timeoutSeconds: 2
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
