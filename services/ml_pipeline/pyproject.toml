[project]
name = "kalshi-crypto-ml-pipeline"
version = "0.2.0"
description = "Quant ML training pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kfp>=2.8.0",
    "google-cloud-aiplatform>=1.60.0",
    "google-cloud-bigquery>=3.25.0,<4",
    "google-cloud-storage>=2.10.0,<3",
    "db-dtypes>=1.2.0,<2",
    "pandas>=2.2.0",
    "gcsfs>=2024.6.0",
    "pyarrow>=17.0.0",
    # Training and packaged inference must deserialize the same sklearn ABI.
    "scikit-learn==1.6.1",
    "xgboost>=2.1.0",
    "joblib>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
