[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-crypto-market-aggregator"
version = "0.1.0"
description = "Real-time multi-venue market state aggregation"
requires-python = ">=3.11"
dependencies = [
    "orjson>=3.10,<4",
    "redis>=6.2,<9",
    "uvloop>=0.22,<1; sys_platform != 'win32' and platform_python_implementation == 'CPython'",
]

[project.scripts]
market-aggregator = "market_aggregator.__main__:main"
aggregator = "market_aggregator.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
