name: Staging Integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: kalshi-crypto-506614
  GCP_REGION: asia-northeast3
  GAR_REPOSITORY: quant-repo
  GKE_CLUSTER: quant-cluster
  STAGING_NAMESPACE: quant-staging
  STAGING_REDIS_HOST: ${{ vars.STAGING_REDIS_HOST }}

jobs:
  integration:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
    - name: Check out tested commit
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}
        persist-credentials: false

    - name: Validate staging configuration
      run: |
        set -euo pipefail
        test -n "${STAGING_REDIS_HOST}" || {
          echo "Set STAGING_REDIS_HOST as a staging environment variable." >&2
          exit 1
        }

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: projects/229993998036/locations/global/workloadIdentityPools/github-pool/providers/github-provider
        service_account: gh-actions-deployer@kalshi-crypto-506614.iam.gserviceaccount.com

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Configure Docker authentication
      run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

    - name: Build and push aggregator test image
      env:
        IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/aggregator
        IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      run: |
        set -euo pipefail
        docker build --platform linux/amd64 -t "${IMAGE_URI}:${IMAGE_TAG}" services/aggregator
        docker push "${IMAGE_URI}:${IMAGE_TAG}"

    - name: Get GKE credentials
      uses: google-github-actions/get-gke-credentials@v3
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GCP_REGION }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Run integration Job in GKE
      env:
        JOB_NAME: "aggregator-it-${{ github.run_id }}"
        NAMESPACE: ${{ env.STAGING_NAMESPACE }}
        AGGREGATOR_IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/aggregator:${{ github.event.workflow_run.head_sha || github.sha }}
        REDIS_URL: redis://${{ env.STAGING_REDIS_HOST }}:6379/0
        BOOK_STREAM: "ci:${{ github.run_id }}:orderbooks"
        TRADE_STREAM: "ci:${{ github.run_id }}:trades"
        OUTPUT_PREFIX: "ci:${{ github.run_id }}:market"
      run: |
        set -euo pipefail
        kubectl get namespace "${NAMESPACE}" >/dev/null
        envsubst '${JOB_NAME} ${NAMESPACE} ${AGGREGATOR_IMAGE} ${REDIS_URL} ${BOOK_STREAM} ${TRADE_STREAM} ${OUTPUT_PREFIX}' \
          < services/aggregator/k8s/integration-job.yaml \
          | kubectl apply -f -

        cleanup() {
          kubectl delete "job/${JOB_NAME}" -n "${NAMESPACE}" --ignore-not-found --wait=false
        }
        diagnostics() {
          kubectl get "job/${JOB_NAME}" -n "${NAMESPACE}" -o wide || true
          kubectl get pods -n "${NAMESPACE}" -l "job-name=${JOB_NAME}" -o wide || true
          kubectl logs "job/${JOB_NAME}" -n "${NAMESPACE}" --all-containers=true || true
        }
        trap cleanup EXIT

        deadline=$((SECONDS + 300))
        while (( SECONDS < deadline )); do
          succeeded="$(kubectl get "job/${JOB_NAME}" -n "${NAMESPACE}" -o jsonpath='{.status.succeeded}')"
          failed="$(kubectl get "job/${JOB_NAME}" -n "${NAMESPACE}" -o jsonpath='{.status.failed}')"
          if [[ "${succeeded:-0}" -ge 1 ]]; then
            break
          fi
          if [[ "${failed:-0}" -ge 1 ]]; then
            echo "Integration Job failed." >&2
            diagnostics
            exit 1
          fi
          sleep 2
        done
        if [[ "${succeeded:-0}" -lt 1 ]]; then
          echo "Integration Job timed out after 5 minutes." >&2
          diagnostics
          exit 1
        fi
        kubectl logs "job/${JOB_NAME}" -n "${NAMESPACE}"
