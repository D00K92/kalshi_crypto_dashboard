name: Deploy Services

on:
  workflow_run:
    workflows: [Staging Integration]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for OIDC Workload Identity authentication

env:
  GCP_PROJECT_ID: kalshi-crypto-506614
  GCP_REGION: asia-northeast3
  GAR_REPOSITORY: quant-repo
  IMAGE_NAME: gcs-exporter
  GKE_CLUSTER: quant-cluster
  GCS_BUCKET_NAME: kalshi-crypto-tick-data
  REDIS_PORT: "6379"

concurrency:
  group: deploy-services
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
    - name: Check out tested commit
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}
        persist-credentials: false

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: projects/229993998036/locations/global/workloadIdentityPools/github-pool/providers/github-provider
        service_account: gh-actions-deployer@kalshi-crypto-506614.iam.gserviceaccount.com

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Configure Docker authentication
      run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

    - name: Build and push GCS exporter image
      env:
        IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}
        IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      run: |
        set -euo pipefail
        docker build --platform linux/amd64 -t "${IMAGE_URI}:${IMAGE_TAG}" services/gcs_exporter
        docker push "${IMAGE_URI}:${IMAGE_TAG}"

    - name: Build and push ingestion image
      env:
        IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/ingestion
        IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      run: |
        set -euo pipefail
        docker build --platform linux/amd64 -t "${IMAGE_URI}:${IMAGE_TAG}" services/ingestion
        docker push "${IMAGE_URI}:${IMAGE_TAG}"

    - name: Build and push aggregator image
      env:
        IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/aggregator
        IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      run: |
        set -euo pipefail
        docker build --platform linux/amd64 -t "${IMAGE_URI}:${IMAGE_TAG}" services/aggregator
        docker push "${IMAGE_URI}:${IMAGE_TAG}"

    - name: Build and push Feast live bridge image
      env:
        IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/feast-store
        IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      run: |
        set -euo pipefail
        docker build --platform linux/amd64 -t "${IMAGE_URI}:${IMAGE_TAG}" services/feast_store
        docker push "${IMAGE_URI}:${IMAGE_TAG}"

    - name: Build and push live feature service image
      env:
        IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/live-feature-service
        IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      run: |
        set -euo pipefail
        docker build --platform linux/amd64 -t "${IMAGE_URI}:${IMAGE_TAG}" services/live_feature_service
        docker push "${IMAGE_URI}:${IMAGE_TAG}"

    - name: Stage approved v4 hybrid model bundle
      env:
        MODEL_RESOURCE_1H: ${{ vars.VOLATILITY_MODEL_1H }}
        MODEL_ARTIFACT_URI_1H: ${{ vars.VOLATILITY_MODEL_1H_ARTIFACT_URI }}
        MODEL_RESOURCE_5M: ${{ vars.VOLATILITY_MODEL_5M_V4 }}
        MODEL_ARTIFACT_URI_5M: ${{ vars.VOLATILITY_MODEL_5M_ARTIFACT_URI_V4 }}
        MODEL_RESOURCE_15M: ${{ vars.VOLATILITY_MODEL_15M_V3 }}
        MODEL_ARTIFACT_URI_15M: ${{ vars.VOLATILITY_MODEL_15M_ARTIFACT_URI_V3 }}
        MODEL_RESOURCE_30M: ${{ vars.VOLATILITY_MODEL_30M_V3 }}
        MODEL_ARTIFACT_URI_30M: ${{ vars.VOLATILITY_MODEL_30M_ARTIFACT_URI_V3 }}
      run: |
        set -euo pipefail
        if [[ -z "${MODEL_RESOURCE_1H}" || -z "${MODEL_ARTIFACT_URI_1H}" || \
              -z "${MODEL_RESOURCE_5M}" || -z "${MODEL_ARTIFACT_URI_5M}" || \
              -z "${MODEL_RESOURCE_15M}" || -z "${MODEL_ARTIFACT_URI_15M}" || \
              -z "${MODEL_RESOURCE_30M}" || -z "${MODEL_ARTIFACT_URI_30M}" ]]; then
          echo "Approved model resources and artifact URIs are required for all horizons." >&2
          exit 1
        fi
        artifact_root="$(mktemp -d)"
        resource_map="${artifact_root}/resources.json"
        for horizon in 5M 15M 30M 1H; do
          uri_var="MODEL_ARTIFACT_URI_${horizon}"
          artifact_uri="${!uri_var%/}"
          target="${artifact_root}/${horizon,,}"
          mkdir -p "${target}"
          gcloud storage cp "${artifact_uri}/model.joblib" "${target}/model.joblib"
          gcloud storage cp "${artifact_uri}/metadata.json" "${target}/metadata.json"
        done
        jq -n \
          --arg r5 "${MODEL_RESOURCE_5M}" --arg u5 "${MODEL_ARTIFACT_URI_5M%/}" \
          --arg r15 "${MODEL_RESOURCE_15M}" --arg u15 "${MODEL_ARTIFACT_URI_15M%/}" \
          --arg r30 "${MODEL_RESOURCE_30M}" --arg u30 "${MODEL_ARTIFACT_URI_30M%/}" \
          --arg r1h "${MODEL_RESOURCE_1H}" --arg u1h "${MODEL_ARTIFACT_URI_1H%/}" \
          '{
            "5m": {"resource": $r5, "artifact_uri": $u5, "trained_feature_version": "v4_10s"},
            "15m": {"resource": $r15, "artifact_uri": $u15, "trained_feature_version": "v3_10s"},
            "30m": {"resource": $r30, "artifact_uri": $u30, "trained_feature_version": "v3_10s"},
            "1h": {"resource": $r1h, "artifact_uri": $u1h, "trained_feature_version": "v2_10s", "architecture": "xgboost"}
          }' > "${resource_map}"
        python services/model_serving/scripts/prepare_bundle.py \
          --artifact-dir "${artifact_root}" \
          --output-dir services/model_serving/model_bundle \
          --model-version v4_volume_har_1 \
          --feature-version v4_10s \
          --resource-map "${resource_map}"

    - name: Build and push model serving image
      env:
        IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/model-serving
        IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      run: |
        set -euo pipefail
        docker build --platform linux/amd64 \
          --build-arg REQUIRE_MODEL_BUNDLE=true \
          --build-arg MODEL_VERSION=v4_volume_har_1 \
          --build-arg FEATURE_VERSION=v4_10s \
          -t "${IMAGE_URI}:${IMAGE_TAG}" services/model_serving
        docker push "${IMAGE_URI}:${IMAGE_TAG}"

    - name: Build and push dashboard image
      env:
        IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/dashboard
        IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      run: |
        set -euo pipefail
        docker build --platform linux/amd64 -t "${IMAGE_URI}:${IMAGE_TAG}" services/dashboard
        docker push "${IMAGE_URI}:${IMAGE_TAG}"

    - name: Build and push analytics image
      env:
        IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/analytics
        IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      run: |
        set -euo pipefail
        docker build --platform linux/amd64 -t "${IMAGE_URI}:${IMAGE_TAG}" services/analytics
        docker push "${IMAGE_URI}:${IMAGE_TAG}"

    - name: Build and push batch ETL image
      env:
        IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/batch-etl
        IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      run: |
        set -euo pipefail
        docker build --platform linux/amd64 -t "${IMAGE_URI}:${IMAGE_TAG}" services/batch_etl
        docker push "${IMAGE_URI}:${IMAGE_TAG}"

    - name: Get GKE credentials
      uses: google-github-actions/get-gke-credentials@v3
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GCP_REGION }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Resolve Redis endpoint
      id: redis
      run: |
        set -euo pipefail
        redis_host="$(gcloud redis instances list \
          --project="${GCP_PROJECT_ID}" \
          --region="${GCP_REGION}" \
          --format='value(host)' | head -n1)"
        if [[ -z "${redis_host}" ]]; then
          echo "No Memorystore Redis instance was found in ${GCP_REGION}." >&2
          exit 1
        fi
        echo "host=${redis_host}" >> "${GITHUB_OUTPUT}"

    - name: Apply Kubernetes manifests
      env:
        GCS_EXPORTER_IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha || github.sha }}
        INGESTION_IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/ingestion:${{ github.event.workflow_run.head_sha || github.sha }}
        AGGREGATOR_IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/aggregator:${{ github.event.workflow_run.head_sha || github.sha }}
        FEAST_STORE_IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/feast-store:${{ github.event.workflow_run.head_sha || github.sha }}
        LIVE_FEATURE_SERVICE_IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/live-feature-service:${{ github.event.workflow_run.head_sha || github.sha }}
        MODEL_SERVING_IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/model-serving:${{ github.event.workflow_run.head_sha || github.sha }}
        DASHBOARD_IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/dashboard:${{ github.event.workflow_run.head_sha || github.sha }}
        ANALYTICS_IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/analytics:${{ github.event.workflow_run.head_sha || github.sha }}
        ANALYTICS_GCP_SERVICE_ACCOUNT: ${{ vars.ANALYTICS_GCP_SERVICE_ACCOUNT }}
        BATCH_ETL_IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/batch-etl:${{ github.event.workflow_run.head_sha || github.sha }}
        REDIS_HOST: ${{ steps.redis.outputs.host }}
      run: |
        set -euo pipefail
        envsubst '${GCS_EXPORTER_IMAGE} ${REDIS_HOST} ${REDIS_PORT} ${GCS_BUCKET_NAME}' \
          < k8s/gcs-exporter-deployment.yaml \
          | kubectl apply -f -
        envsubst '${INGESTION_IMAGE} ${REDIS_HOST} ${REDIS_PORT}' \
          < k8s/ingestion-deployment.yaml \
          | kubectl apply -f -
        envsubst '${AGGREGATOR_IMAGE} ${REDIS_HOST} ${REDIS_PORT}' \
          < k8s/aggregator-deployment.yaml \
          | kubectl apply -f -
        envsubst '${LIVE_FEATURE_SERVICE_IMAGE} ${REDIS_HOST} ${REDIS_PORT}' \
          < k8s/live-feature-service-deployment.yaml \
          | kubectl apply -f -
        envsubst '${FEAST_STORE_IMAGE} ${REDIS_HOST}' \
          < k8s/feast-live-bridge-deployment.yaml \
          | kubectl apply -f -
        envsubst '${FEAST_STORE_IMAGE}' \
          < k8s/feast-server-deployment.yaml \
          | kubectl apply -f -
        envsubst '${FEAST_STORE_IMAGE} ${REDIS_HOST}' \
          < k8s/feature-parity-cronjob.yaml \
          | kubectl apply -f -
        envsubst '${DASHBOARD_IMAGE} ${REDIS_HOST} ${REDIS_PORT}' \
          < k8s/dashboard-deployment.yaml \
          | kubectl apply -f -
        kubectl apply -f k8s/dashboard-public-ingress.yaml
        envsubst '${MODEL_SERVING_IMAGE}' \
          < k8s/model-serving-deployment.yaml \
          | kubectl apply -f -
        required='${ANALYTICS_GCP_SERVICE_ACCOUNT}'
        if [[ "${required}" == *'  '* || "${required}" == ' '* || "${required}" == *' ' ]]; then
          echo "Analytics deployment prerequisite missing: configure all analytics repository variables." >&2
          exit 1
        fi
        envsubst '${ANALYTICS_IMAGE} ${REDIS_HOST} ${REDIS_PORT} ${GCP_PROJECT_ID} ${GCP_REGION} ${ANALYTICS_GCP_SERVICE_ACCOUNT}' \
          < k8s/analytics-deployment.yaml \
          | kubectl apply -f -
        envsubst '${BATCH_ETL_IMAGE} ${GCS_BUCKET_NAME}' \
          < k8s/batch-etl-cronjob.yaml \
          | kubectl apply -f -
        envsubst '${BATCH_ETL_IMAGE} ${GCS_BUCKET_NAME} ${GCP_PROJECT_ID}' \
          < k8s/batch-etl-feature-cronjobs.yaml \
          | kubectl apply -f -

    - name: Verify rollouts
      run: |
        set -euo pipefail
        kubectl rollout status deployment/gcs-exporter --timeout=5m
        kubectl rollout status deployment/ingestion-service --timeout=5m
        kubectl rollout status deployment/aggregator --timeout=5m
        kubectl rollout status deployment/live-feature-service --timeout=5m
        kubectl rollout status deployment/live-feature-service-v4 --timeout=5m
        kubectl rollout status deployment/feast-live-bridge --timeout=5m
        kubectl rollout status deployment/feast-server --timeout=5m
        kubectl rollout status deployment/model-serving --timeout=5m
        kubectl rollout status deployment/dashboard --timeout=5m
        if ! kubectl rollout status deployment/analytics --timeout=5m; then
          echo "Analytics container did not become ready. Running pods with a failed /readyz usually indicate a missing/invalid model artifact, IAM grant, live feature, spot, ticker, or Kalshi metadata prerequisite." >&2
          kubectl get pods -l app=analytics -o wide
          kubectl logs deployment/analytics --tail=100 || true
          exit 1
        fi
        kubectl get cronjob/batch-etl
        kubectl get cronjob/batch-etl-features cronjob/batch-etl-targets cronjob/feature-parity-v2-10s

    - name: Gate deployment on offline-online feature parity
      env:
        PARITY_JOB: feature-parity-deploy-${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        set -euo pipefail
        kubectl create job "${PARITY_JOB}" --from=cronjob/feature-parity-v2-10s
        if ! kubectl wait --for=condition=complete "job/${PARITY_JOB}" --timeout=5m; then
          kubectl logs "job/${PARITY_JOB}" --all-containers=true || true
          exit 1
        fi
        kubectl logs "job/${PARITY_JOB}" --all-containers=true
        kubectl delete "job/${PARITY_JOB}" --wait=false

    - name: Smoke check analytics outputs
      env:
        EXPECTED_MODEL_RESOURCE_1H: ${{ vars.VOLATILITY_MODEL_1H }}
        EXPECTED_MODEL_RESOURCE_5M: ${{ vars.VOLATILITY_MODEL_5M_V4 }}
        EXPECTED_MODEL_RESOURCE_15M: ${{ vars.VOLATILITY_MODEL_15M_V3 }}
        EXPECTED_MODEL_RESOURCE_30M: ${{ vars.VOLATILITY_MODEL_30M_V3 }}
      run: |
        set -euo pipefail
        kubectl exec deployment/analytics -- env \
          "EXPECTED_MODEL_RESOURCE_1H=${EXPECTED_MODEL_RESOURCE_1H}" \
          "EXPECTED_MODEL_RESOURCE_5M=${EXPECTED_MODEL_RESOURCE_5M}" \
          "EXPECTED_MODEL_RESOURCE_15M=${EXPECTED_MODEL_RESOURCE_15M}" \
          "EXPECTED_MODEL_RESOURCE_30M=${EXPECTED_MODEL_RESOURCE_30M}" python -c '
        import asyncio, json, os, time, urllib.request
        import redis.asyncio as redis
        async def check():
            with urllib.request.urlopen("http://127.0.0.1:8080/readyz", timeout=3) as response:
                assert response.status == 200, "analytics /readyz failed"
            client = redis.Redis(host=os.environ["REDIS_HOST"], port=int(os.environ["REDIS_PORT"]))
            now = int(time.time() * 1000)
            feature_raw = await client.get("market:features:v4_10s:BTCUSD:latest")
            assert feature_raw, "missing live v4 feature snapshot"
            feature = json.loads(feature_raw)
            assert feature["feature_version"] == "v4_10s", "wrong live feature contract"
            required = {"log_buy_volume_30s", "log_buy_volume_5m", "log_buy_volume_10m"}
            assert required <= feature["values"].keys(), "missing live buyer-volume features"
            assert now - feature["event_timestamp_ms"] <= 90_000, "stale v4 feature snapshot"
            volatility_raw = await client.get("market:volatility:v2_10s:BTCUSD:latest")
            assert volatility_raw, "missing fresh volatility snapshot (check packaged model and live features)"
            volatility = json.loads(volatility_raw)
            assert volatility["model_version"] == "v4_volume_har_1", "wrong model contract"
            assert now - volatility["generated_ts_ms"] <= 60_000, "stale volatility snapshot"
            resources = volatility["model_resources"]
            assert resources["1h"] == os.environ["EXPECTED_MODEL_RESOURCE_1H"], "1h champion is not live"
            assert resources["5m"] == os.environ["EXPECTED_MODEL_RESOURCE_5M"], "5m volume HAR is not live"
            assert resources["15m"] == os.environ["EXPECTED_MODEL_RESOURCE_15M"], "15m HAR is not live"
            assert resources["30m"] == os.environ["EXPECTED_MODEL_RESOURCE_30M"], "30m HAR is not live"
            assert all(float(value) > 0 for value in volatility["annualized_volatility"].values()), "invalid volatility"
            keys = [key async for key in client.scan_iter(match="market:pricing:v1:KXBTCD-*")]
            fresh = []
            for key in keys:
                raw = await client.get(key)
                if raw:
                    payload = json.loads(raw)
                    if payload.get("status") == "available" and now - payload.get("generated_ts_ms", 0) <= 60_000:
                        fresh.append(key)
            assert fresh, "no fresh Kalshi price (check open <=1h event, ticker freshness, and REST metadata)"
            await client.aclose()
        asyncio.run(check())'
        kubectl exec deployment/dashboard -- python -c '
        import json, time
        from dashboard.data import RedisReader, redis_client_from_env
        client = redis_client_from_env()
        for _ in range(30):
            spot = json.loads(client.get("market:spot:BTCUSDT:latest"))
            rows = RedisReader(client).read_kalshi_data(spot.get("price"))["contracts"]
            missing = [row["market_ticker"] for row in rows if row.get("model_value") == "-"]
            if rows and not missing:
                break
            time.sleep(1)
        else:
            raise AssertionError(f"dashboard contracts missing fair prices: {missing}")'
