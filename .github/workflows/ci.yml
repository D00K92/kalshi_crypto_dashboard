name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ingestion
            path: services/ingestion
          - service: gcs-exporter
            path: services/gcs_exporter
          - service: aggregator
            path: services/aggregator
          - service: dashboard
            path: services/dashboard
          - service: analytics
            path: services/analytics
            python_version: "3.12"
          - service: batch-etl
            path: services/batch_etl
            python_version: "3.12"
          - service: live-feature-service
            path: services/live_feature_service
            python_version: "3.12"
          - service: model-serving
            path: services/model_serving
            python_version: "3.12"
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: ${{ matrix.python_version || '3.13' }}
          enable-cache: true
          cache-dependency-glob: ${{ matrix.path }}/uv.lock

      - name: Install locked dependencies
        run: |
          if [[ -f uv.lock ]]; then
            uv sync --locked
          else
            uv sync
          fi

      - name: Run tests
        run: |
          if [[ -f uv.lock ]]; then
            uv run --locked pytest
          else
            uv run pytest
          fi

  docker-builds:
    name: Docker build - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ingestion
            context: services/ingestion
          - service: gcs-exporter
            context: services/gcs_exporter
          - service: aggregator
            context: services/aggregator
          - service: dashboard
            context: services/dashboard
          - service: analytics
            context: services/analytics
          - service: batch-etl
            context: services/batch_etl
          - service: live-feature-service
            context: services/live_feature_service
          - service: model-serving
            context: services/model_serving
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build linux/amd64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
